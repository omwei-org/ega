[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextone-observer-ega-interop-reference"
version = "0.1.0"
description = "Standalone reference implementation validating the evidence boundary between a minimal read-only NextOne Observer and EGA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary reference implementation" }
dependencies = [
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
