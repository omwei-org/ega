name: ComOS TypeScript gate tests

on:
  push:
    branches:
      - "integration/comos-typescript-gate-v01"
  pull_request:
    branches:
      - main
      - "integration/comos-http-gate-v01"

jobs:
  test-typescript-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EGA service dependencies
        run: python -m pip install -e ".[service]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test TypeScript gate against the real EGA service
        run: python integrations/comos/run-real-service-test.py
