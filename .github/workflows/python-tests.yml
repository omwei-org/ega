name: Python tests

on:
  push:
    branches:
      - main
      - "fix/ega-service-security-v01"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test/service dependencies
        run: python -m pip install -e ".[test,service]"
      - name: Run test suite
        run: python -m pytest -q
