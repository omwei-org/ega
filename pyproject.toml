[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ega-reference"
version = "0.1.0"
description = "Open-source reference implementation of Execution Governance Authority"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28"]
service = ["fastapi>=0.104,<0.115", "uvicorn[standard]>=0.24,<0.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
